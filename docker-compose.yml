version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: pulsegate_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: pulsegate_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pulsegate_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - pulsegate_net

  redis:
    image: redis:7-alpine
    container_name: pulsegate_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - pulsegate_net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pulsegate_backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/pulsegate_db
      REDIS_URL: redis://redis:6379/0
      UPSTREAM_SERVICE_URL: https://httpbin.org
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - pulsegate_net

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pulsegate_worker
    command: ["arq", "app.core.worker.WorkerSettings"]
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/pulsegate_db
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - pulsegate_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: pulsegate_frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - pulsegate_net

volumes:
  postgres_data:

networks:
  pulsegate_net:
    driver: bridge